name: Population Flow Tracker

"on":
  schedule:
    - cron: "0 1 26 * *"   # 毎月26日 10:00 JST（UTC 01:00）。e-Statの月次更新は25日頃
  workflow_dispatch:        # 手動実行ボタン

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data and rebuild dashboard
        env:
          E_STAT_APP_ID: ${{ secrets.E_STAT_APP_ID }}
        run: python main.py

      - name: Commit updated data and dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/migration.csv data/tokyo_municipalities.csv docs/index.html
          git diff --cached --quiet || git commit -m "chore: update migration data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
